[project]
name = "actvoice"
version = "0.1.0"
description = "Accessible-first audio drama production service with REST/MCP-ready APIs."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100",
  "pydantic>=2.0",
  "uvicorn>=0.20",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
